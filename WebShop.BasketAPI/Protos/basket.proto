syntax = "proto3";

option csharp_namespace = "WebShop.BasketAPI";

package basket;

// The basket service definition.
service Basket {

  // Adds an item to the basket
  rpc GetBasket (GetBasketRequest) returns (BasketResponse);
  rpc AddToBasket (AddToBasketRequest) returns (BasketResponse);
  rpc RemoveFromBasket (RemoveFromBasketRequest) returns (BasketResponse);
}

// The request message containing the catalog item.
message AddToBasketRequest {
  int32  UserId = 1;
  int32  CatalogId = 2;
  int32  Quantity = 3; // Default quantity is 1
  string  Name = 4;
}

// The request message containing the catalog item.
message RemoveFromBasketRequest {
  int32  UserId = 1;
  int32  CatalogId = 2;
  int32  Quantity = 3; // Default quantity is 1
  string  Name = 4;
}

// The response message containing the status.
message BasketResponse {
  bool Success = 1;
  string Message = 2;
}

message GetBasketRequest {
}